name: Deploy prod

# Manual only until prod Render services exist (stage Blueprint has no prod yet).
# When ready: add prod to render.yaml, create GitHub Environment "production"
# with RENDER_DEPLOY_HOOK_PROD, then re-enable workflow_run on main if desired.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Missing secret RENDER_DEPLOY_HOOK_PROD in GitHub Environment 'production'" >&2
            echo "Prod is not wired yet — see docs/environments.md" >&2
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Post-deploy health
        env:
          SMOKE_BASE_URL: https://mentorix-api.onrender.com
          SMOKE_REQUIRE: "1"
          SMOKE_WAIT_SECONDS: "600"
        run: bash scripts/smoke.sh
