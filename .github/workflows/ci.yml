name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: mentorix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d mentorix_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/mentorix_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -count=1

      - name: Store integration tests
        run: go test -tags integration -timeout 5m ./internal/db/storetest/... -count=1

      - name: Coverage gate (85%)
        run: ./scripts/coverage.sh --min 85

      - name: Go build
        run: go build -o /dev/null ./...

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0

      - name: sqlc generate
        run: $(go env GOPATH)/bin/sqlc generate

      - name: sqlc generated code up to date
        run: git diff --exit-code internal/db/sqlc/

      - name: Contract validation
        run: SKIP_SMOKE=1 bash postman/validate.sh

      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2 run ./...
