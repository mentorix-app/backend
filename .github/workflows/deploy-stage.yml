name: Deploy stage

# After CI succeeds on develop (avoids a second full check run).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGE }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Missing secret RENDER_DEPLOY_HOOK_STAGE in GitHub Environment 'staging'" >&2
            exit 1
          fi
          case "$RENDER_DEPLOY_HOOK" in
            *\?*) hook_url="${RENDER_DEPLOY_HOOK}&ref=${DEPLOY_SHA}" ;;
            *) hook_url="${RENDER_DEPLOY_HOOK}?ref=${DEPLOY_SHA}" ;;
          esac
          curl -fsS -X POST "$hook_url"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Post-deploy smoke
        env:
          SMOKE_BASE_URL: https://mentorix-api-stage.onrender.com
          SMOKE_REQUIRE: "1"
          SMOKE_WAIT_SECONDS: "600"
          SMOKE_EXPECT_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: bash scripts/smoke.sh
