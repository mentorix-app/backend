# Mentorix Blueprint — stage only (web + Postgres + Key Value).
# Prod services are NOT in this file yet — add later when needed (docs/environments.md).
# Deploy: autoDeploy off; GitHub Deploy Hook after green CI (deploy-stage.yml).

databases:
  - name: mentorix-db-stage
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: frankfurt
    databaseName: mentorix
    ipAllowList: [] # private network only; External URL from Dashboard for local dump/restore

services:
  - type: keyvalue
    name: mentorix-redis-stage
    plan: starter
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList: []

  - type: web
    name: mentorix-api-stage
    runtime: go
    plan: starter
    region: frankfurt
    branch: develop
    autoDeployTrigger: "off"
    buildCommand: bash scripts/render-build.sh
    preDeployCommand: bash scripts/render-migrate.sh
    startCommand: ./bin/api
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: development
      - key: DATABASE_URL
        fromDatabase:
          name: mentorix-db-stage
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mentorix-redis-stage
          property: connectionString
      - key: TRUSTED_PROXY_CIDRS
        value: private
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: BOT_WEBHOOK_URL
        value: https://mentorix-api-stage.onrender.com/telegram/webhook
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_WEBHOOK_SECRET
        sync: false
      - key: TRAINER_INVITE_TTL_DAYS
        sync: false
