services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mentorix
      POSTGRES_PASSWORD: mentorix
      POSTGRES_DB: mentorix
    ports:
      - "5432:5432"
    volumes:
      - mentorix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentorix -d mentorix"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  mentorix_pgdata:
