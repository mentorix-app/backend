version: "2"

sql:
  - engine: postgresql
    schema: db/schema.sql
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        json_tags_case_style: snake
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: pg_catalog.uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
