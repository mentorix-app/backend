      responses:
        "200":
          description: Paginated program analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramsAnalyticsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Trainer role required

  /trainer/programs/{program_id}/analytics:
    parameters:
      - $ref: "#/components/parameters/AnalyticsProgramId"
    get:
      tags: [analytics]
      summary: Program analytics detail
      description: >
