        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden (not owner and not admin)
        "404":
          description: Program, week, or block not found

  /programs/{id}/weeks/{week_id}/blocks/{block_id}/ungroup:
