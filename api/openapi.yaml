      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden (not owner and not admin)
        "404":
          description: Program not found

  /programs/{id}/weeks/{week_id}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/ProgramWeekId"
    delete:
      tags: [programs]
      summary: Delete program week
      description: Returns 409 when deleting the last week in the program.
      operationId: deleteProgramWeek
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden (not owner and not admin)
        "404":
          description: Program or week not found
        "409":
          description: Cannot delete the last week

  /programs/{id}/weeks/{week_id}/days:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/ProgramWeekId"
    post:
      tags: [programs]
      summary: Add day to program week
      description: Returns 409 when the week already has 7 days (maximum).
      operationId: addProgramDay
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Program with new day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden (not owner and not admin)
        "404":
          description: Program or week not found
        "409":
