        aggregates: active clients, lifetime and 30-day completion counts
        (across all versions), average completion percent of current cycles,
        last activity. Default sort: last_activity desc.
      operationId: listTrainerProgramsAnalytics
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
