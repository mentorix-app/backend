              schema:
                $ref: "#/components/schemas/ProgramDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden (not owner and not admin)
        "404":
          description: Program, week, or block not found

  /programs/{id}/weeks/{week_id}/blocks/{block_id}/clients:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/ProgramWeekId"
      - $ref: "#/components/parameters/ProgramDayBlockId"
    put:
      tags: [programs]
      summary: Replace the visibility rules of a block
      description: >
        Full replace: the body carries the complete client list. An empty
        list makes the block shared (visible to every client assigned to the
        program) again. Restricting a block is refused with 400 when it would
        leave a day without a shared block, checked against the working copy
        and against every published version a client is currently assigned
        to.
      operationId: setProgramBlockClients
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramBlockClientsSet"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden (not owner and not admin)
        "404":
          description: Program, week, or block not found

  /programs/{id}/weeks/{week_id}/blocks/{block_id}/exercises/{item_id}/extract:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/ProgramWeekId"
      - $ref: "#/components/parameters/ProgramDayBlockId"
      - $ref: "#/components/parameters/ProgramDayExerciseId"
    post:
      tags: [programs]
      summary: Extract exercise from group into a new single block
      operationId: extractProgramBlockExercise
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramBlockExerciseExtract"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden (not owner and not admin)
        "404":
          description: Program, week, block, or exercise item not found

  /programs/{id}/weeks/{week_id}/blocks/{block_id}/exercises/{item_id}/move:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/ProgramWeekId"
      - $ref: "#/components/parameters/ProgramDayBlockId"
      - $ref: "#/components/parameters/ProgramDayExerciseId"
    post:
      tags: [programs]
      summary: Move exercise into another block in the same week
      operationId: moveProgramExerciseToBlock
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramExerciseMove"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden (not owner and not admin)
        "404":
          description: Program, week, or exercise item not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RefreshCookie:
      name: mentorix_refresh
      in: cookie
      required: false
      schema:
        type: string
      description: HttpOnly refresh token (name configurable via REFRESH_COOKIE_NAME)

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SortBy:
      name: sort_by
      in: query
      schema:
        type: string
        enum:
          - name
          - name_ru
          - created_at
          - modified_at
          - difficulty
          - type
          - muscle_group
          - equipment
        default: name

    SortOrder:
      name: sort_order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc

    ExerciseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramVersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ClientUserId:
      name: client_user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ClientTrainerId:
      name: trainer_id
      in: path
      required: true
      description: trainers.id, as listed by `GET /client/trainers`.
      schema:
        type: string
        format: uuid

    CompletionId:
      name: completion_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramWeekId:
      name: week_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramDayId:
      name: day_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramDayExerciseId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramDayBlockId:
      name: block_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramSortBy:
      name: sort_by
      in: query
      schema:
        type: string
        enum: [name, name_ru, created_at, modified_at, status, category, difficulty]
        default: created_at

    TrainerClientSortBy:
      name: sort_by
      in: query
      schema:
        type: string
        enum: [name, linked_at]
        default: linked_at

    TrainerClientSortOrder:
      name: sort_order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

    AnalyticsProgramId:
      name: program_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AnalyticsWeekNumber:
      name: week_number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    ProgramAnalyticsSortBy:
      name: sort_by
      in: query
      schema:
        type: string
        enum: [name, last_activity]
        default: last_activity

  responses:
    BadRequest:
      description: Invalid request (code `bad_request` unless the operation lists another)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: >
        Missing or invalid access token: code `missing_authorization` when the
        Authorization header is missing or is not a Bearer token, `invalid_token`
        when the token is malformed, expired or signed with another key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded (code `rate_limited`)
      headers:
        Retry-After:
          description: Whole seconds until the rate-limit window ends, at least 1
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    QuotaExceeded:
      description: Plan quota exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QuotaExceededError"

  schemas:
    ErrorResponse:
      type: object
      description: >
        Body of every error response. `code` is stable: clients may branch on it.
        `message` is text for people and may change, so clients must not parse it.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable snake_case identifier of the error
          example: invite_expired
        message:
          type: string
          example: invite expired

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        commit:
          type: string
          description: Git commit the running binary was deployed from. Omitted when the deploy platform does not provide it (for example local runs). Not returned by /health/ready.
          example: 0123abcd4567ef890123abcd4567ef890123abcd

    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready, no_dependencies_configured]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, error, skipped]

    AuthCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
        name:
          type: string
          maxLength: 100
          description: Optional display name; defaults to empty string

    IDTokenRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: Google ID token from the app
        nonce:
          type: string
          maxLength: 256
          description: >
            Optional raw nonce, at most 256 characters. The app passes its SHA-256 as
            lowercase hex to Google and sends the raw value here; the token's
            `nonce` claim must then equal that hash, otherwise `401
            invalid_id_token`. Empty or absent skips the check. Longer than 256
            characters answers `400`.

    AppleSignInRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: Apple ID token from the app
        name:
          type: string
          description: Display name the app received from Apple; optional, cut to 100 characters, used when the account is created or fills an empty name of an existing account
        nonce:
          type: string
          maxLength: 256
          description: >
            Optional raw nonce, at most 256 characters. The app passes its SHA-256 as
            lowercase hex to Apple and sends the raw value here; the token's
            `nonce` claim must then equal that hash, otherwise `401
            invalid_id_token`. Empty or absent skips the check. Longer than 256
            characters answers `400`.

    DeleteAccountRequest:
      type: object
      description: >
        Optional body of `DELETE /auth/me`. The two Apple fields go together; the
        redirect address needs both.
      properties:
        apple_id_token:
          type: string
          description: Apple ID token of a Sign in with Apple the app just ran; must belong to one of the account's Apple identities
        apple_authorization_code:
          type: string
          description: Authorization code of the same sign-in. Single use, valid for five minutes
        apple_redirect_uri:
          type: string
          description: >
            Redirect address of the authorization request, an absolute https URL
            without a fragment, at most 2048 characters. Android sends the
            address it gave Apple; iOS sends none

    TrainerActivationRequest:
      type: object
      required: [terms_version]
      properties:
        terms_version:
          type: string
          format: date
          example: "2026-10-01"
          description: >
            Version of the trainer terms the person accepted: a calendar date in
            the form `YYYY-MM-DD`. Surrounding white space is ignored

    TelegramLinkRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: One-time code the bot sent to the Telegram user; case and surrounding spaces are ignored

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Refresh token kept by the app; empty or absent means cookie mode

    MePatchRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: Display name; empty string clears the name

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_at, refresh_expires_at, user_id, email]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
          description: >
            When the refresh token issued with this response expires. Present
            whether the refresh token is in the cookie or in the body.
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        refresh_token:
          type: string
          description: Present for Google sign-in and body-mode refresh; absent when the cookie carries it

    MeResponse:
      type: object
      required: [user_id, email, name, created_at, roles, telegram_linked]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string
            enum: [admin, trainer, client]
        subscription:
          $ref: "#/components/schemas/Subscription"
        telegram_linked:
          type: boolean
          description: True when the account has a Telegram sign-in

    Subscription:
      type: object
      nullable: true
      description: Effective plan of the trainer profile; null for users without one.
      required: [plan, source, valid_until, limits, usage, permissions]
      properties:
        plan:
          $ref: "#/components/schemas/PlanCode"
        source:
          type: string
          nullable: true
          enum: [admin, app_store, google_play, null]
          description: Who issued the active entitlement; null on the free tier.
        valid_until:
          type: string
          format: date-time
          nullable: true
          description: Expiry of the active entitlement; null means perpetual.
        limits:
          $ref: "#/components/schemas/PlanLimits"
        usage:
          $ref: "#/components/schemas/PlanUsage"
        permissions:
          $ref: "#/components/schemas/PlanPermissions"

    PlanCode:
      type: string
      enum: [free, advance, elite]

    PlanLimits:
      type: object
      required: [exercises, active_programs, active_clients]
      properties:
        exercises:
          type: integer
          nullable: true
          description: Null means unlimited.
        active_programs:
          type: integer
          nullable: true
          description: Null means unlimited.
        active_clients:
          type: integer
          nullable: true
          description: Null means unlimited.

    PlanUsage:
      type: object
      required: [exercises, active_programs, active_clients]
      properties:
        exercises:
          type: integer
        active_programs:
          type: integer
        active_clients:
          type: integer

    PlanPermissions:
      type: object
      required:
        - can_create_exercise
        - can_edit_exercises
        - can_create_program
        - can_edit_programs
        - can_create_invite
        - can_manage_clients
      properties:
        can_create_exercise:
          type: boolean
        can_edit_exercises:
          type: boolean
        can_create_program:
          type: boolean
        can_edit_programs:
          type: boolean
        can_create_invite:
          type: boolean
        can_manage_clients:
          type: boolean

    PlanCatalogResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanCatalogItem"

    PlanCatalogItem:
      type: object
      required: [code, limits]
      properties:
        code:
          $ref: "#/components/schemas/PlanCode"
        limits:
          $ref: "#/components/schemas/PlanLimits"

    GrantPlanRequest:
      type: object
      required: [plan]
      properties:
        plan:
          $ref: "#/components/schemas/PlanCode"

    TrainerPlanResponse:
      type: object
      required: [user_id, subscription]
      properties:
        user_id:
          type: string
          format: uuid
        subscription:
          $ref: "#/components/schemas/Subscription"

    QuotaExceededError:
      type: object
      required: [code, message, error, resource, plan, limit, usage]
      properties:
        code:
          type: string
          enum: [quota_exceeded]
        message:
          type: string
          example: quota exceeded
        error:
          type: string
          description: Repeats `code`; the web cabinet's quota parser reads it
          enum: [quota_exceeded]
        resource:
          type: string
          enum: [exercises, programs, clients]
        plan:
          $ref: "#/components/schemas/PlanCode"
        limit:
          type: integer
        usage:
          type: integer

    ExerciseListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ExerciseDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    ExerciseDeleteResponse:
      type: object
      required: [deleted_count]
      properties:
        deleted_count:
          type: integer
          format: int64
          minimum: 0

    Pagination:
      type: object
      required: [page, limit, total, total_pages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    Exercise:
      type: object
      required:
        - id
        - name
        - name_ru
        - created_by
        - created_by_name
        - modified_by
        - modified_at
        - created_at
        - type
        - muscle_group
        - description
        - description_ru
        - difficulty
        - video_url
        - preview_image_url
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        name_ru:
          type: string
        created_by:
          type: string
          format: uuid
        created_by_name:
          type: string
        modified_by:
          type: string
          format: uuid
        modified_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        equipment:
          $ref: "#/components/schemas/Equipment"
        type:
          $ref: "#/components/schemas/ExerciseType"
        muscle_group:
          $ref: "#/components/schemas/MuscleGroup"
        description:
          type: string
        description_ru:
          type: string
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        video_url:
          type: string
          description: Optional YouTube video URL (HTTPS). Empty string when not set.
        preview_image_url:
          type: string
        scope:
          type: string
          enum: [global, private]
          description: Global exercises are admin-owned and visible to everyone; private ones belong to a trainer.
        owner_user_id:
          type: string
          format: uuid
          nullable: true
          description: User id of the owning trainer; null for global exercises.

    ExerciseUpsert:
      type: object
      required: [name, type, muscle_group, difficulty]
      properties:
        name:
          type: string
          maxLength: 1000
        name_ru:
          type: string
          maxLength: 1000
        equipment:
          $ref: "#/components/schemas/Equipment"
        type:
          $ref: "#/components/schemas/ExerciseType"
        muscle_group:
          $ref: "#/components/schemas/MuscleGroup"
        description:
          type: string
          maxLength: 5000
        description_ru:
          type: string
          maxLength: 5000
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        video_url:
          type: string
          description: Optional YouTube video URL (HTTPS). Empty string when not set.
        preview_image_url:
          type: string

    MuscleGroup:
      type: string
      enum:
        - compound
        - chest
        - back
        - legs
        - shoulders
        - arms
        - core
        - full_body

    ExerciseType:
      type: string
      enum:
        - strength
        - cardio
        - mixed_modal
        - intervals
        - stretching
        - metcon
        - skill_work
        - accessory

    Equipment:
      type: string
      enum:
        - barbell
        - dumbbells
        - kettlebell
        - pull_up_bar
        - squat_rack
        - rowing_machine
        - assault_bike
        - bike_erg
        - ski_erg
        - jump_rope
        - plyo_box
        - medicine_ball
        - wall_ball
        - resistance_bands
        - battle_ropes
        - gymnastic_rings
        - sandbag
        - sled
        - weight_plates

    Difficulty:
      type: string
      enum:
        - beginner
        - intermediate
        - advanced
        - expert

    ProgramStatus:
      type: string
      enum: [draft, published, archived]

    ProgramCategory:
      type: string
      enum:
        - weight_loss
        - muscle_gain
        - rehabilitation
        - endurance
        - functional

    Program:
      type: object
      required:
        - id
        - created_by
        - created_by_name
        - modified_by
        - status
        - name
        - name_ru
        - description
        - description_ru
        - preview_image_url
        - has_unpublished_changes
        - assignment_count
        - training_days_count
        - created_at
        - modified_at
      properties:
        id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        created_by_name:
          type: string
        modified_by:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ProgramStatus"
        name:
          type: string
        name_ru:
          type: string
        description:
          type: string
        description_ru:
          type: string
        category:
          $ref: "#/components/schemas/ProgramCategory"
          nullable: true
        difficulty:
          $ref: "#/components/schemas/Difficulty"
          nullable: true
        preview_image_url:
          type: string
        latest_program_version_id:
          type: string
          format: uuid
          nullable: true
          description: Latest frozen plan for clients; null before first publish.
        latest_client_plan_at:
          type: string
          format: date-time
          nullable: true
          description: When the latest frozen plan was published.
        has_unpublished_changes:
          type: boolean
          description: >
            True when the editable program differs from the latest frozen version.
        assignment_count:
          type: integer
          minimum: 0
          description: Number of active client assignments on this program.
        training_days_count:
          type: integer
          minimum: 0
          description: >
            Total days with at least one block or exercise across all weeks.
            Empty days (no blocks) are not counted.
        created_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    ProgramDayExercise:
      type: object
      required:
        - id
        - exercise_id
        - exercise_name
        - exercise_name_ru
        - sort_order
        - instruction
        - created_at
      properties:
        id:
          type: string
          format: uuid
        exercise_id:
          type: string
          format: uuid
        exercise_name:
          type: string
        exercise_name_ru:
          type: string
        sort_order:
          type: integer
        sets:
          type: string
          nullable: true
          pattern: '^[0-9]+([/-][0-9]+)?$'
          description: >
            Optional volume string: digits only (`3`), one slash (`5/4`), or one
            hyphen (`3-6`).
          example: "3"
        reps:
          type: string
          nullable: true
          pattern: '^[0-9]+([/-][0-9]+)?$'
          description: >
            Optional volume string: digits only (`10`), one slash (`5/4`), or one
            hyphen (`8-12`).
          example: "10"
        instruction:
          type: string
        created_at:
          type: string
          format: date-time

    ProgramDayBlock:
      type: object
      required: [id, block_type, instruction, sort_order, client_user_ids, exercises, created_at]
      properties:
        id:
          type: string
          format: uuid
        block_type:
          $ref: "#/components/schemas/ProgramBlockType"
        instruction:
          type: string
        sort_order:
          type: integer
        client_user_ids:
          type: array
          description: >-
            Clients allowed to see this block. An empty array means the block
            is visible to every client assigned to the program.
          items:
            type: string
            format: uuid
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDayExercise"
        created_at:
          type: string
          format: date-time

    ProgramBlockType:
      type: string
      enum:
        - single
        - emom
        - amrap
        - for_time
        - intervals
        - chipper
        - ladder
        - death_by
        - superset
        - complex
        - skill_work
        - strength
        - conditioning
        - gymnastics
        - weightlifting

    ProgramBlockGroupType:
      type: string
      enum:
        - emom
        - amrap
        - for_time
        - intervals
        - chipper
        - ladder
        - death_by
        - superset
        - complex
        - skill_work
        - strength
        - conditioning
        - gymnastics
        - weightlifting
      description: Group block types only; `single` is not patchable.

    ProgramDay:
      type: object
      required: [id, day_key, day_number, sort_order, blocks, created_at]
      properties:
        id:
          type: string
          format: uuid
        day_key:
          type: string
          format: uuid
          description: >
            Stable id of the day. It survives publishing and syncing, while `id` is
            regenerated. Workout marks and the `completed_days` of the client app use it.
        day_number:
          type: integer
        sort_order:
          type: integer
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDayBlock"
        created_at:
          type: string
          format: date-time

    ProgramWeek:
      type: object
      required: [id, week_number, sort_order, days, created_at]
      properties:
        id:
          type: string
          format: uuid
        week_number:
          type: integer
        sort_order:
          type: integer
        days:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDay"
        created_at:
          type: string
          format: date-time

    ProgramDetail:
      allOf:
        - $ref: "#/components/schemas/Program"
        - type: object
          required: [weeks]
          properties:
            weeks:
              type: array
              items:
                $ref: "#/components/schemas/ProgramWeek"

    ProgramWeeksReorder:
      type: object
      required: [week_ids]
      description: >
        Complete ordered list of all week IDs in the program (every week exactly once).
      properties:
        week_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    ProgramDaysReorder:
      type: object
      required: [day_ids]
      description: >
        Complete ordered list of all day IDs in the week (every day exactly once).
      properties:
        day_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    ProgramDayBlockCreate:
      type: object
      required: [exercise]
      properties:
        block_type:
          type: string
          enum: [single]
          default: single
          description: Only `single` is allowed; omit or use default.
        sort_order:
          type: integer
          minimum: 1
          description: >
            Optional 1-based position in the day. Omit to append at the end.
        exercise:
          $ref: "#/components/schemas/ProgramDayExerciseUpsert"
      description: >
        Adds one exercise to the day as a `single` block. To create a group,
        add singles and call merge.

    ProgramDayBlocksReorder:
      type: object
      required: [block_ids]
      description: >
        Complete ordered list of all block IDs in the day (every block exactly once).
      properties:
        block_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    ProgramBlockExercisesReorder:
      type: object
      required: [exercise_item_ids]
      description: >
        Complete ordered list of all exercise item IDs in the block (every item exactly once).
      properties:
        exercise_item_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    ProgramDayBlocksMerge:
      type: object
      required: [block_ids]
      properties:
        block_ids:
          type: array
          minItems: 2
          items:
            type: string
            format: uuid

    ProgramDayBlockPatch:
      type: object
      properties:
        block_type:
          $ref: "#/components/schemas/ProgramBlockGroupType"
        instruction:
          type: string
          maxLength: 5000
      description: Patch group block metadata. At least one field required.

    ProgramDayBlockMove:
      type: object
      required: [target_day_id]
      properties:
        target_day_id:
          type: string
          format: uuid
        sort_order:
          type: integer
          minimum: 1
          description: >
            Optional 1-based position among blocks in the target day.
            Omit to append at the end.

    ProgramBlockClientsSet:
      type: object
      required: [client_user_ids]
      properties:
        client_user_ids:
          type: array
          description: >-
            Complete replacement list. Empty makes the block shared again.
          items:
            type: string
            format: uuid

    ProgramBlockExerciseExtract:
      type: object
      properties:
        sort_order:
          type: integer
          minimum: 1
          description: >
            Optional 1-based position for the new single block in the day.
            Omit to append at the end.

    ProgramExerciseMove:
      type: object
      required: [target_block_id]
      properties:
        target_block_id:
          type: string
          format: uuid

    ProgramListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Program"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ProgramPatch:
      type: object
      description: >
        Partial update for draft and published programs. Archived programs are
        read-only (403 on mutations). Empty `name` is allowed in draft; publish
        validates that name is non-empty.
      properties:
        name:
          type: string
          maxLength: 1000
        name_ru:
          type: string
          maxLength: 1000
        description:
          type: string
          maxLength: 5000
        description_ru:
          type: string
          maxLength: 5000
        category:
          $ref: "#/components/schemas/ProgramCategory"
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        preview_image_url:
          type: string

    ProgramDayExerciseUpsert:
      type: object
      required: [exercise_id]
      description: >
        `sets` and `reps` are optional and may be omitted or `null`. When set,
        each must be digits only (`3`), digits with one `/` (`5/4`), or digits
        with one `-` (`3-6`).
      properties:
        exercise_id:
          type: string
          format: uuid
        sets:
          type: string
          nullable: true
          pattern: '^[0-9]+([/-][0-9]+)?$'
          description: >
            Optional volume string: digits only (`3`), one slash (`5/4`), or one
            hyphen (`3-6`).
          example: "3"
        reps:
          type: string
          nullable: true
          pattern: '^[0-9]+([/-][0-9]+)?$'
          description: >
            Optional volume string: digits only (`10`), one slash (`5/4`), or one
            hyphen (`8-12`).
          example: "10"
        instruction:
          type: string
          maxLength: 5000

    ProgramAssignmentStatus:
      type: string
      enum:
        - active
        - completed
        - cancelled

    ProgramAssignment:
      type: object
      required:
        - id
        - program_id
        - program_version_id
        - trainer_id
        - client_user_id
        - status
        - assigned_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        program_version_id:
          type: string
          format: uuid
        trainer_id:
          type: string
          format: uuid
        client_user_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ProgramAssignmentStatus"
        assigned_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        client_plan_at:
          type: string
          format: date-time
          nullable: true
          description: When the assigned frozen version was published.
        is_behind_latest:
          type: boolean
          description: Present in program assignment lists when client is not on latest version.

    ProgramAssignmentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProgramAssignment"
        latest_program_version_id:
          type: string
          format: uuid
          nullable: true

    BulkSetClientProgramAssignmentRequest:
      type: object
      required: [client_user_ids]
      properties:
        program_id:
          type: string
          format: uuid
          nullable: true
          description: Published program to assign; null clears active assignments.
        client_user_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid

    BulkClientProgramAssignmentSkipped:
      type: object
      required: [client_user_id, reason]
      properties:
        client_user_id:
          type: string
          format: uuid
        reason:
          type: string
          description: not_linked, blocked, or not_found

    BulkClientProgramAssignmentResponse:
      type: object
      required: [assigned, cleared, skipped]
      properties:
        assigned:
          type: array
          items:
            $ref: "#/components/schemas/ProgramAssignment"
        cleared:
          type: array
          items:
            type: string
            format: uuid
          description: Client user IDs whose active assignment was removed
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/BulkClientProgramAssignmentSkipped"

    ProgramAssignmentSyncRequest:
      type: object
      description: Provide either all_active or assignment_ids (not both empty).
      properties:
        all_active:
          type: boolean
        assignment_ids:
          type: array
          items:
            type: string
            format: uuid

    ProgramAssignmentSyncSkipped:
      type: object
      required: [assignment_id, reason]
      properties:
        assignment_id:
          type: string
          format: uuid
        reason:
          type: string

    ProgramAssignmentSyncResponse:
      type: object
      required: [synced, skipped]
      properties:
        synced:
          type: array
          items:
            $ref: "#/components/schemas/ProgramAssignment"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/ProgramAssignmentSyncSkipped"

    ProgramVersionSummary:
      type: object
      required:
        - id
        - version_number
        - published_at
        - created_at
        - assignment_count
        - can_delete
      properties:
        id:
          type: string
          format: uuid
        version_number:
          type: integer
          minimum: 1
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        assignment_count:
          type: integer
          minimum: 0
        can_delete:
          type: boolean

    ProgramVersionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProgramVersionSummary"

    ProgramVersionCleanupSkipped:
      type: object
      required: [version_id, reason]
      properties:
        version_id:
          type: string
          format: uuid
        reason:
          type: string
          description: >-
            Why the version was kept. `sole_version`: it is the only version.
            `has_assignments`: a client is still assigned to it.
            `latest_version`: it is the newest version, so the next assignment
            and sync land on it.

    ProgramVersionCleanupResponse:
      type: object
      required: [deleted_version_ids, skipped]
      properties:
        deleted_version_ids:
          type: array
          items:
            type: string
            format: uuid
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/ProgramVersionCleanupSkipped"

    TrainerInvite:
      type: object
      required: [id, invite_url, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        invite_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    ClientAcceptInviteRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Bare invite token, `inv_<token>`, or the whole invite link; surrounding spaces are ignored

    ClientAcceptInviteResponse:
      type: object
      required: [trainer_id, trainer_display_name, already_linked]
      properties:
        trainer_id:
          type: string
          format: uuid
        trainer_display_name:
          type: string
        already_linked:
          type: boolean

    ClientTrainer:
      type: object
      required: [trainer_id, trainer_display_name, linked_at]
      properties:
        trainer_id:
          type: string
          format: uuid
          description: trainers.id, the same id `POST /client/invites/accept` returns.
        trainer_display_name:
          type: string
          description: May be an empty string when the trainer has not set a name.
        linked_at:
          type: string
          format: date-time

    ClientTrainerListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest link first. Empty when the caller has no active trainer link.
          items:
            $ref: "#/components/schemas/ClientTrainer"

    ClientProgramAssignment:
      type: object
      required: [assignment_id, program_id, program_version_id, completion_cycle_id, assigned_at]
      properties:
        assignment_id:
          type: string
          format: uuid
          description: Send it back as `program_assignment_id` when marking a day.
        program_id:
          type: string
          format: uuid
        program_version_id:
          type: string
          format: uuid
          description: The version the `program` below shows. Send it back when marking a day.
        completion_cycle_id:
          type: string
          format: uuid
          description: >
            The cycle the checkmarks belong to. A new one starts with every reassignment.
            Send it back when marking a day.
        assigned_at:
          type: string
          format: date-time

    ClientProgram:
      type: object
      required: [program_id, name, name_ru, description, description_ru, category, difficulty, preview_image_url, weeks]
      description: >
        The program as the app shows it. The weeks, days and blocks are the ones of
        `ProgramDetail`, cut to the blocks the caller may see, with `day_key` on every day.
        In a block `client_user_ids` is `[]` for a shared block and only the caller for a
        block limited to chosen clients.
      properties:
        program_id:
          type: string
          format: uuid
        name:
          type: string
        name_ru:
          type: string
        description:
          type: string
        description_ru:
          type: string
        category:
          $ref: "#/components/schemas/ProgramCategory"
          nullable: true
        difficulty:
          $ref: "#/components/schemas/Difficulty"
          nullable: true
        preview_image_url:
          type: string
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/ProgramWeek"

    ClientCompletedDay:
      type: object
      required: [day_key]
      properties:
        day_key:
          type: string
          format: uuid

    ClientProgramResponse:
      type: object
      required: [trainer_id, trainer_display_name, assignment, program, completed_days]
      properties:
        trainer_id:
          type: string
          format: uuid
          description: trainers.id
        trainer_display_name:
          type: string
          description: May be an empty string when the trainer has not set a name.
        assignment:
          $ref: "#/components/schemas/ClientProgramAssignment"
          nullable: true
        program:
          allOf:
            - $ref: "#/components/schemas/ClientProgram"
          nullable: true
          description: The version of the assignment, with only the blocks the caller may see.
        completed_days:
          type: array
          description: Days marked done in the current cycle. Empty without an assignment.
          items:
            $ref: "#/components/schemas/ClientCompletedDay"

    ClientCompletionRequest:
      type: object
      required: [program_assignment_id, program_version_id, completion_cycle_id, day_key, result_text]
      properties:
        program_assignment_id:
          type: string
          format: uuid
          description: "`assignment.assignment_id` of the program answer the app was showing."
        program_version_id:
          type: string
          format: uuid
          description: "`assignment.program_version_id` of the program answer the app was showing."
        completion_cycle_id:
          type: string
          format: uuid
          description: "`assignment.completion_cycle_id` of the program answer the app was showing."
        day_key:
          type: string
          format: uuid
        result_text:
          type: string
          maxLength: 1000
          description: >
            Free text, required, trimmed, at most 1000 characters. Control characters other
            than line breaks and tabs are refused.

    ClientCompletionResponse:
      type: object
      required: [id, day_key, week_number, day_number, completed_at, result_text]
      properties:
        id:
          type: string
          format: uuid
        day_key:
          type: string
          format: uuid
        week_number:
          type: integer
        day_number:
          type: integer
        completed_at:
          type: string
          format: date-time
        result_text:
          type: string
          description: The stored text, trimmed.

    TrainerClientProgramSummary:
      type: object
      required:
        - assignment_id
        - program_id
        - program_version_id
        - assigned_at
        - program_name
        - program_name_ru
      properties:
        assignment_id:
          type: string
          format: uuid
          description: Active program_assignments.id; use for POST /programs/{id}/assignments/sync.
        program_id:
          type: string
          format: uuid
        program_version_id:
          type: string
          format: uuid
        assigned_at:
          type: string
          format: date-time
        program_name:
          type: string
          description: Frozen version display name (English).
        program_name_ru:
          type: string
          description: Frozen version display name (Russian).
        is_behind_latest:
          type: boolean
          description: >
            True when the client's frozen version differs from the program's latest
            frozen version. Omitted when there is no active program assignment.

    TrainerClient:
      type: object
      required:
        - client_user_id
        - trainer_user_id
        - trainer_display_name
        - display_name
        - status
        - linked_at
        - last_active_at
        - avatar_url
      properties:
        client_user_id:
          type: string
          format: uuid
        trainer_user_id:
          type: string
          format: uuid
          description: >
            User id of the trainer for the client link shown in this item.
            Compare with user_id from GET /auth/me to allow program assignment.
        trainer_display_name:
          type: string
          description: Display name of the trainer for the link shown in this item.
        display_name:
          type: string
        status:
          type: string
          enum: [active, blocked]
        linked_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Latest `client_workout_completions.completed_at` for this client
            (any trainer). Null when the client has never completed a workout day.
        avatar_url:
          type: string
          description: >
            Signed relative URL to avatar proxy (`/trainer/clients/{id}/avatar?exp=&sig=`),
            or empty string when the client has no Telegram profile photo.
        program_assignment:
          $ref: "#/components/schemas/TrainerClientProgramSummary"
          nullable: true

    TrainerClientListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrainerClient"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ClientAnalytics:
      type: object
      required: [client, current_assignment, activity]
      properties:
        client:
          $ref: "#/components/schemas/AnalyticsClientInfo"
        current_assignment:
          $ref: "#/components/schemas/AnalyticsAssignment"
          nullable: true
        activity:
          $ref: "#/components/schemas/AnalyticsActivity"

    ClientSelfAnalytics:
      type: object
      required: [client, trainer, current_assignment, activity, recent_completions, expires_at]
      properties:
        client:
          $ref: "#/components/schemas/ClientSelfInfo"
        trainer:
          $ref: "#/components/schemas/ClientSelfTrainer"
        current_assignment:
          $ref: "#/components/schemas/AnalyticsAssignment"
          nullable: true
        activity:
          $ref: "#/components/schemas/AnalyticsActivity"
        recent_completions:
          type: array
          description: Latest completions with this trainer, newest first, at most 30
          items:
            $ref: "#/components/schemas/ClientCompletionItem"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the signed link stops working. `null` on `GET /client/trainers/{trainer_id}/analytics`,
            which has no link.

    ClientSelfInfo:
      type: object
      required: [client_user_id, display_name]
      properties:
        client_user_id:
          type: string
          format: uuid
        display_name:
          type: string

    ClientSelfTrainer:
      type: object
      required: [trainer_id, display_name]
      properties:
        trainer_id:
          type: string
          format: uuid
          description: trainers.id
        display_name:
          type: string

    AnalyticsClientInfo:
      type: object
      required: [client_user_id, display_name, avatar_url, status, linked_at, last_active_at]
      properties:
        client_user_id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
          description: Signed avatar proxy URL or empty string
        status:
          type: string
          enum: [active, blocked]
        linked_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
          nullable: true

    AnalyticsAssignment:
      type: object
      required:
        [program_id, program_version_id, program_name, program_name_ru,
         assigned_at, is_behind_latest, progress]
      properties:
        program_id:
          type: string
          format: uuid
        program_version_id:
          type: string
          format: uuid
        program_name:
          type: string
        program_name_ru:
          type: string
        assigned_at:
          type: string
          format: date-time
        is_behind_latest:
          type: boolean
        progress:
          $ref: "#/components/schemas/AnalyticsProgress"

    AnalyticsProgress:
      type: object
      required: [completed_days, total_training_days, completion_percent, weeks]
      description: >
        Current completion cycle vs the assigned frozen version. The cycle
        survives version sync, so progress spans all versions of one assignment.
      properties:
        completed_days:
          type: integer
        total_training_days:
          type: integer
          description: Days with at least one block in the assigned version
        completion_percent:
          type: number
          format: double
          description: 0-100, one decimal, clamped at 100
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsWeekProgress"

    AnalyticsWeekProgress:
      type: object
      required: [week_number, total_days, completed_days]
      properties:
        week_number:
          type: integer
        total_days:
          type: integer
        completed_days:
          type: integer

    AnalyticsActivity:
      type: object
      required:
        [total_completions, completions_last_7_days, completions_last_30_days,
         first_completed_at, last_completed_at, week_streak, by_program]
      description: Lifetime activity with this trainer, across all cycles and programs.
      properties:
        total_completions:
          type: integer
        completions_last_7_days:
          type: integer
        completions_last_30_days:
          type: integer
        first_completed_at:
          type: string
          format: date-time
          nullable: true
        last_completed_at:
          type: string
          format: date-time
          nullable: true
        week_streak:
          type: integer
          description: >
            Consecutive calendar weeks (Mon-Sun, UTC) with at least one
            completion. The streak is alive while the current week is still
            in progress.
        by_program:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsProgramActivity"

    AnalyticsProgramActivity:
      type: object
      required:
        [program_id, program_name, program_name_ru, total_completions,
         first_completed_at, last_completed_at]
      properties:
        program_id:
          type: string
          format: uuid
          nullable: true
          description: Null when the program row was deleted (name from journal snapshot)
        program_name:
          type: string
        program_name_ru:
          type: string
        total_completions:
          type: integer
        first_completed_at:
          type: string
          format: date-time
        last_completed_at:
          type: string
          format: date-time

    ClientCompletionsResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientCompletionItem"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ClientCompletionItem:
      type: object
      required:
        [id, completed_at, program_id, program_name, program_name_ru,
         week_number, day_number, result_text, is_current_cycle, comments]
      properties:
        id:
          type: string
          format: uuid
        completed_at:
          type: string
          format: date-time
        program_id:
          type: string
          format: uuid
          nullable: true
        program_name:
          type: string
        program_name_ru:
          type: string
        week_number:
          type: integer
        day_number:
          type: integer
        result_text:
          type: string
          description: Client's free-text workout result from Telegram
        is_current_cycle:
          type: boolean
          description: True when the completion belongs to the client's current assignment cycle
        comments:
          type: array
          description: Trainer replies on this result (at most one for now), oldest first
          items:
            $ref: "#/components/schemas/CompletionComment"

    CompletionComment:
      type: object
      required: [id, text, created_at]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        created_at:
          type: string
          format: date-time

    CreateCompletionCommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: Trainer reply text

    ProgramsAnalyticsResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProgramAnalyticsItem"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ProgramAnalyticsItem:
      type: object
      required:
        [program_id, name, name_ru, status, training_days_count,
         active_clients_count, total_completions, completions_last_30_days,
         avg_completion_percent, last_activity_at]
      properties:
        program_id:
          type: string
          format: uuid
        name:
          type: string
        name_ru:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        training_days_count:
          type: integer
          description: Non-empty days in the draft tree
        active_clients_count:
          type: integer
        total_completions:
          type: integer
          description: Lifetime completions across all versions and cycles
        completions_last_30_days:
          type: integer
        avg_completion_percent:
          type: number
          format: double
          nullable: true
          description: >
            Average current-cycle completion percent of active assignees
            (0-100, one decimal). Null when there are no active clients.
        last_activity_at:
          type: string
          format: date-time
          nullable: true

    ProgramAnalytics:
      type: object
      required: [program, summary, clients, weeks]
      properties:
        program:
          $ref: "#/components/schemas/ProgramAnalyticsHeader"
        summary:
          $ref: "#/components/schemas/ProgramAnalyticsSummary"
        clients:
          type: array
          items:
            $ref: "#/components/schemas/ProgramAnalyticsClient"
        weeks:
          type: array
          description: Current-cycle completions of active assignees grouped by program week
          items:
            $ref: "#/components/schemas/ProgramAnalyticsWeek"

    ProgramAnalyticsHeader:
      type: object
      required: [program_id, name, name_ru, status, latest_version_number, training_days_count]
      properties:
        program_id:
          type: string
          format: uuid
        name:
          type: string
        name_ru:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        latest_version_number:
          type: integer
          description: 0 when the program has never been published
        training_days_count:
          type: integer

    ProgramAnalyticsSummary:
      type: object
      required:
        [active_clients_count, total_completions, completions_last_30_days,
         avg_completion_percent, last_activity_at]
      properties:
        active_clients_count:
          type: integer
        total_completions:
          type: integer
        completions_last_30_days:
          type: integer
        avg_completion_percent:
          type: number
          format: double
          nullable: true
        last_activity_at:
          type: string
          format: date-time
          nullable: true

    ProgramAnalyticsClient:
      type: object
      required:
        [client_user_id, display_name, avatar_url, assigned_at, is_behind_latest,
         completed_days, total_training_days, completion_percent, last_completed_at]
      properties:
        client_user_id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
        assigned_at:
          type: string
          format: date-time
        is_behind_latest:
          type: boolean
        completed_days:
          type: integer
        total_training_days:
          type: integer
        completion_percent:
          type: number
          format: double
        last_completed_at:
          type: string
          format: date-time
          nullable: true

    ProgramAnalyticsWeek:
      type: object
      required: [week_number, completions_count, distinct_clients_count]
      properties:
        week_number:
          type: integer
        completions_count:
          type: integer
        distinct_clients_count:
          type: integer

    ProgramWeekResults:
      type: object
      required:
        [program_id, program_name, program_name_ru, week_number, days, summary, clients]
      properties:
        program_id:
          type: string
          format: uuid
        program_name:
          type: string
        program_name_ru:
          type: string
        week_number:
          type: integer
        days:
          type: array
          items:
            $ref: "#/components/schemas/ProgramWeekDayColumn"
        summary:
          $ref: "#/components/schemas/ProgramWeekMatrixSummary"
        clients:
          type: array
          items:
            $ref: "#/components/schemas/ProgramWeekMatrixClient"

    ProgramWeekDayColumn:
      type: object
      required: [day_number]
      properties:
        day_number:
          type: integer

    ProgramWeekMatrixSummary:
      type: object
      required:
        [total_training_slots, submitted_count, missing_count,
         completion_percent, behind_clients_count]
      properties:
        total_training_slots:
          type: integer
          description: clients × training days in the week
        submitted_count:
          type: integer
        missing_count:
          type: integer
        completion_percent:
          type: number
          format: double
        behind_clients_count:
          type: integer
          description: Assignees whose assigned version is behind latest

    ProgramWeekMatrixClient:
      type: object
      required:
        [client_user_id, display_name, avatar_url, is_behind_latest,
         completed_days, total_days, days]
      properties:
        client_user_id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
        is_behind_latest:
          type: boolean
        completed_days:
          type: integer
          description: Submitted cells in this week
        total_days:
          type: integer
          description: Training day columns in this week
        days:
          type: array
          items:
            $ref: "#/components/schemas/ProgramWeekMatrixCell"

    ProgramWeekMatrixCell:
      type: object
      required: [day_number, status, completion_id, result_text, completed_at, comments]
      properties:
        day_number:
          type: integer
        status:
          type: string
          enum: [submitted, no_result]
        completion_id:
          type: string
          format: uuid
          nullable: true
        result_text:
          type: string
        completed_at:
          type: string
          format: date-time
          nullable: true
        comments:
          type: array
          items:
            $ref: "#/components/schemas/CompletionComment"
