  /programs/{id}/weeks/{week_id}/days/reorder:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/ProgramWeekId"
    put:
      tags: [programs]
      summary: Reorder days within a program week
      description: >
        Sets the order of all days in the week. Request body must list **every**
        day ID exactly once in the desired order. Partial lists, unknown IDs, or
        duplicates return 400 (e.g. `invalid reorder: day count mismatch`).
      operationId: reorderProgramDays
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramDaysReorder"
