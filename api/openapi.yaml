        "404":
          description: Program, week, block, or exercise item not found
    delete:
      tags: [programs]
      summary: Remove exercise from program day block
      description: Deleting the only exercise from a `single` block removes the block.
      operationId: deleteProgramBlockExercise
      security:
        - bearerAuth: []
      responses:
        "200":
