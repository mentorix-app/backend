  /programs/{id}/weeks/{week_id}/blocks/{block_id}/exercises/{item_id}/extract:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/ProgramWeekId"
      - $ref: "#/components/parameters/ProgramDayBlockId"
      - $ref: "#/components/parameters/ProgramDayExerciseId"
    post:
      tags: [programs]
      summary: Extract exercise from group into a new single block
      operationId: extractProgramBlockExercise
      security:
