components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RefreshCookie:
      name: mentorix_refresh
      in: cookie
      required: false
      schema:
        type: string
      description: HttpOnly refresh token (name configurable via REFRESH_COOKIE_NAME)

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SortBy:
      name: sort_by
      in: query
      schema:
        type: string
        enum:
          - name
          - name_ru
          - created_at
          - modified_at
          - difficulty
          - type
          - muscle_group
          - equipment
        default: name

    SortOrder:
      name: sort_order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc

    ExerciseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramVersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ClientUserId:
      name: client_user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramWeekId:
      name: week_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramDayId:
      name: day_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramDayExerciseId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramDayBlockId:
      name: block_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramSortBy:
      name: sort_by
      in: query
      schema:
        type: string
        enum: [name, name_ru, created_at, modified_at, status, category, difficulty]
        default: created_at

    TrainerClientSortBy:
      name: sort_by
      in: query
      schema:
        type: string
        enum: [name, linked_at]
        default: linked_at

    TrainerClientSortOrder:
      name: sort_order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  responses:
    BadRequest:
      description: Invalid request
    Unauthorized:
      description: Missing or invalid access token
    TooManyRequests:
      description: Rate limit exceeded

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready, no_dependencies_configured]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, error, skipped]

    AuthCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
        name:
          type: string
          description: Optional display name; defaults to empty string

    MePatchRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Display name; empty string clears the name

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_at, user_id, email]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email

    MeResponse:
      type: object
      required: [user_id, email, name, created_at, roles]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string
            enum: [admin, trainer, client]

    ExerciseListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ExerciseDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    ExerciseDeleteResponse:
      type: object
      required: [deleted_count]
      properties:
        deleted_count:
          type: integer
          format: int64
          minimum: 0

    Pagination:
      type: object
      required: [page, limit, total, total_pages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    Exercise:
      type: object
      required:
        - id
        - name
        - name_ru
        - created_by
        - created_by_name
        - modified_by
        - modified_at
        - created_at
        - type
        - muscle_group
        - description
        - description_ru
        - difficulty
        - video_url
        - preview_image_url
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        name_ru:
          type: string
        created_by:
          type: string
          format: uuid
        created_by_name:
          type: string
        modified_by:
          type: string
          format: uuid
        modified_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        equipment:
          $ref: "#/components/schemas/Equipment"
        type:
          $ref: "#/components/schemas/ExerciseType"
        muscle_group:
          $ref: "#/components/schemas/MuscleGroup"
        description:
          type: string
        description_ru:
          type: string
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        video_url:
          type: string
          description: Optional YouTube video URL (HTTPS). Empty string when not set.
        preview_image_url:
          type: string

    ExerciseUpsert:
      type: object
      required: [name, type, muscle_group, difficulty]
      properties:
        name:
          type: string
        name_ru:
          type: string
        equipment:
          $ref: "#/components/schemas/Equipment"
        type:
          $ref: "#/components/schemas/ExerciseType"
        muscle_group:
          $ref: "#/components/schemas/MuscleGroup"
        description:
          type: string
        description_ru:
          type: string
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        video_url:
          type: string
          description: Optional YouTube video URL (HTTPS). Empty string when not set.
        preview_image_url:
          type: string

    MuscleGroup:
      type: string
      enum:
        - compound
        - chest
        - back
        - legs
        - shoulders
        - arms
        - core
        - full_body

    ExerciseType:
      type: string
      enum:
        - strength
        - cardio
        - mixed_modal
        - intervals
        - stretching
        - metcon
        - skill_work
        - accessory

    Equipment:
      type: string
      enum:
        - barbell
        - dumbbells
        - kettlebell
        - pull_up_bar
        - squat_rack
        - rowing_machine
        - assault_bike
        - jump_rope
        - plyo_box
        - medicine_ball
        - wall_ball
        - resistance_bands
        - battle_ropes
        - gymnastic_rings
        - sandbag
        - sled
        - weight_plates

    Difficulty:
      type: string
      enum:
        - beginner
        - intermediate
        - advanced
        - expert

    ProgramStatus:
      type: string
      enum: [draft, published, archived]

    ProgramCategory:
      type: string
      enum:
        - weight_loss
        - muscle_gain
        - rehabilitation
        - endurance
        - functional

    Program:
      type: object
      required:
        - id
        - created_by
        - created_by_name
        - modified_by
        - status
        - name
        - name_ru
        - description
        - description_ru
        - preview_image_url
        - has_unpublished_changes
        - assignment_count
        - created_at
        - modified_at
      properties:
        id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        created_by_name:
          type: string
        modified_by:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ProgramStatus"
        name:
          type: string
        name_ru:
          type: string
        description:
          type: string
        description_ru:
          type: string
        category:
          $ref: "#/components/schemas/ProgramCategory"
          nullable: true
        difficulty:
          $ref: "#/components/schemas/Difficulty"
          nullable: true
        preview_image_url:
          type: string
        latest_program_version_id:
          type: string
          format: uuid
          nullable: true
          description: Latest frozen plan for clients; null before first publish.
        latest_client_plan_at:
          type: string
          format: date-time
          nullable: true
          description: When the latest frozen plan was published.
        has_unpublished_changes:
          type: boolean
          description: >
            True when the editable program differs from the latest frozen version.
        assignment_count:
          type: integer
          minimum: 0
          description: Number of active client assignments on this program.
        created_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    ProgramDayExercise:
      type: object
      required:
        - id
        - exercise_id
        - exercise_name
        - exercise_name_ru
        - sort_order
        - instruction
        - created_at
      properties:
        id:
          type: string
          format: uuid
        exercise_id:
          type: string
          format: uuid
        exercise_name:
          type: string
        exercise_name_ru:
          type: string
        sort_order:
          type: integer
        sets:
          type: integer
          minimum: 1
          nullable: true
        reps:
          type: integer
          minimum: 1
          nullable: true
        instruction:
          type: string
        created_at:
          type: string
          format: date-time

    ProgramDayBlock:
      type: object
      required: [id, block_type, instruction, sort_order, exercises, created_at]
      properties:
        id:
          type: string
          format: uuid
        block_type:
          $ref: "#/components/schemas/ProgramBlockType"
        instruction:
          type: string
        sort_order:
          type: integer
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDayExercise"
        created_at:
          type: string
          format: date-time

    ProgramBlockType:
      type: string
      enum:
        - single
        - emom
        - amrap
        - for_time
        - intervals
        - chipper
        - ladder
        - death_by
        - superset
        - complex

    ProgramBlockGroupType:
      type: string
      enum:
        - emom
        - amrap
        - for_time
        - intervals
        - chipper
        - ladder
        - death_by
        - superset
        - complex
      description: Group block types only; `single` is not patchable.

    ProgramDay:
      type: object
      required: [id, day_number, sort_order, blocks, created_at]
      properties:
        id:
          type: string
          format: uuid
        day_number:
          type: integer
        sort_order:
          type: integer
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDayBlock"
        created_at:
          type: string
          format: date-time

    ProgramWeek:
      type: object
      required: [id, week_number, sort_order, days, created_at]
      properties:
        id:
          type: string
          format: uuid
        week_number:
          type: integer
        sort_order:
          type: integer
        days:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDay"
        created_at:
          type: string
          format: date-time

    ProgramDetail:
      allOf:
        - $ref: "#/components/schemas/Program"
        - type: object
          required: [weeks]
          properties:
            weeks:
              type: array
              items:
                $ref: "#/components/schemas/ProgramWeek"

    ProgramWeeksReorder:
      type: object
      required: [week_ids]
      description: >
        Complete ordered list of all week IDs in the program (every week exactly once).
      properties:
        week_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    ProgramDaysReorder:
      type: object
      required: [day_ids]
      description: >
        Complete ordered list of all day IDs in the week (every day exactly once).
      properties:
        day_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    ProgramDayBlockCreate:
      type: object
      required: [exercise]
      properties:
        block_type:
          type: string
          enum: [single]
          default: single
          description: Only `single` is allowed; omit or use default.
        sort_order:
          type: integer
          minimum: 1
          description: >
            Optional 1-based position in the day. Omit to append at the end.
        exercise:
          $ref: "#/components/schemas/ProgramDayExerciseUpsert"
      description: >
        Adds one exercise to the day as a `single` block. To create a group,
        add singles and call merge.

    ProgramDayBlocksReorder:
      type: object
      required: [block_ids]
      description: >
        Complete ordered list of all block IDs in the day (every block exactly once).
      properties:
        block_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    ProgramBlockExercisesReorder:
      type: object
      required: [exercise_item_ids]
      description: >
        Complete ordered list of all exercise item IDs in the block (every item exactly once).
      properties:
        exercise_item_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    ProgramDayBlocksMerge:
      type: object
      required: [block_ids]
      properties:
        block_ids:
          type: array
          minItems: 2
          items:
            type: string
            format: uuid

    ProgramDayBlockPatch:
      type: object
      properties:
        block_type:
          $ref: "#/components/schemas/ProgramBlockGroupType"
        instruction:
          type: string
      description: Patch group block metadata. At least one field required.

    ProgramDayBlockMove:
      type: object
      required: [target_day_id]
      properties:
        target_day_id:
          type: string
          format: uuid
        sort_order:
          type: integer
          minimum: 1
          description: >
            Optional 1-based position among blocks in the target day.
            Omit to append at the end.

    ProgramBlockExerciseExtract:
      type: object
      properties:
        sort_order:
          type: integer
          minimum: 1
          description: >
            Optional 1-based position for the new single block in the day.
            Omit to append at the end.

    ProgramExerciseMove:
      type: object
      required: [target_block_id]
      properties:
        target_block_id:
          type: string
          format: uuid

    ProgramListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Program"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ProgramPatch:
      type: object
      description: >
        Partial update for draft and published programs. Archived programs are
        read-only (403 on mutations). Empty `name` is allowed in draft; publish
        validates that name is non-empty.
      properties:
        name:
          type: string
        name_ru:
          type: string
        description:
          type: string
        description_ru:
          type: string
        category:
          $ref: "#/components/schemas/ProgramCategory"
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        preview_image_url:
          type: string

    ProgramDayExerciseUpsert:
      type: object
      required: [exercise_id]
      description: >
        `sets` and `reps` are optional and may be omitted or `null`; when a
        numeric value is provided, it must be >= 1.
      properties:
        exercise_id:
          type: string
          format: uuid
        sets:
          type: integer
          minimum: 1
          nullable: true
        reps:
          type: integer
          minimum: 1
          nullable: true
        instruction:
          type: string

    ProgramAssignmentStatus:
      type: string
      enum:
        - active
        - completed
        - cancelled

    ProgramAssignment:
      type: object
      required:
        - id
        - program_id
        - program_version_id
        - trainer_id
        - client_user_id
        - status
        - assigned_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        program_version_id:
          type: string
          format: uuid
        trainer_id:
          type: string
          format: uuid
        client_user_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ProgramAssignmentStatus"
        assigned_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        client_plan_at:
          type: string
          format: date-time
          nullable: true
          description: When the assigned frozen version was published.
        is_behind_latest:
          type: boolean
          description: Present in program assignment lists when client is not on latest version.

    ProgramAssignmentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProgramAssignment"
        latest_program_version_id:
          type: string
          format: uuid
          nullable: true

    SetClientProgramAssignmentRequest:
      type: object
      properties:
        program_id:
          type: string
          format: uuid
          nullable: true
          description: Published program to assign; null clears the active assignment.

    ProgramAssignmentSyncRequest:
      type: object
      description: Provide either all_active or assignment_ids (not both empty).
      properties:
        all_active:
          type: boolean
        assignment_ids:
          type: array
          items:
            type: string
            format: uuid

    ProgramAssignmentSyncSkipped:
      type: object
      required: [assignment_id, reason]
      properties:
        assignment_id:
          type: string
          format: uuid
        reason:
          type: string

    ProgramAssignmentSyncResponse:
      type: object
      required: [synced, skipped]
      properties:
        synced:
          type: array
          items:
            $ref: "#/components/schemas/ProgramAssignment"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/ProgramAssignmentSyncSkipped"

    ProgramVersionSummary:
      type: object
      required:
        - id
        - version_number
        - published_at
        - created_at
        - assignment_count
        - can_delete
      properties:
        id:
          type: string
          format: uuid
        version_number:
          type: integer
          minimum: 1
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        assignment_count:
          type: integer
          minimum: 0
        can_delete:
          type: boolean

    ProgramVersionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProgramVersionSummary"

    ProgramVersionCleanupSkipped:
      type: object
      required: [version_id, reason]
      properties:
        version_id:
          type: string
          format: uuid
        reason:
          type: string

    ProgramVersionCleanupResponse:
      type: object
      required: [deleted_version_ids, skipped]
      properties:
        deleted_version_ids:
          type: array
          items:
            type: string
            format: uuid
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/ProgramVersionCleanupSkipped"

    TrainerInvite:
      type: object
      required: [id, invite_url, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        invite_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    TrainerClientProgramSummary:
      type: object
      required: [program_id, program_version_id, assigned_at]
      properties:
        program_id:
          type: string
          format: uuid
        program_version_id:
          type: string
          format: uuid
        assigned_at:
          type: string
          format: date-time

    TrainerClient:
      type: object
      required: [client_user_id, display_name, status, linked_at]
      properties:
        client_user_id:
          type: string
          format: uuid
        display_name:
          type: string
        status:
          type: string
          enum: [active, blocked]
        linked_at:
          type: string
          format: date-time
        program_assignment:
          $ref: "#/components/schemas/TrainerClientProgramSummary"
          nullable: true

    TrainerClientListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrainerClient"
        pagination:
          $ref: "#/components/schemas/Pagination"
