      - $ref: "#/components/parameters/ProgramWeekId"
      - $ref: "#/components/parameters/ProgramDayBlockId"
    post:
      tags: [programs]
      summary: Add exercise to a program day group block
      operationId: addProgramBlockExercise
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramDayExerciseUpsert"
      responses:
        "201":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden (not owner and not admin)
        "404":
          description: Program, week, or block not found

  /programs/{id}/weeks/{week_id}/blocks/{block_id}/move:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/ProgramWeekId"
      - $ref: "#/components/parameters/ProgramDayBlockId"
    post:
      tags: [programs]
      summary: Move a block to another day in the same week
      operationId: moveProgramDayBlock
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramDayBlockMove"
      responses:
        "200":
