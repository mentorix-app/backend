      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden (not owner and not admin)
        "404":
          description: Program, week, or block not found
    delete:
      tags: [programs]
      summary: Delete a group block from program day
      description: Only non-single blocks can be deleted directly.
      operationId: deleteProgramDayBlock
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated program
